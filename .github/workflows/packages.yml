name: Native packages

# .deb / .rpm (Linux, amd64 + arm64) and the Windows installer. Built and install-tested
# on every change to the packaging; attached to the GitHub Release on v* tags.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packages.yml"
      - "backend/requirements.txt"
      - "backend/app/__init__.py"
      - "backend/app/__main__.py"
      - "backend/app/config.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: "2.48.0"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 3

  linux:
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nfpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - name: Install nfpm
        run: |
          f="nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz"
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSLO "$base/$f" && curl -fsSLO "$base/checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "$f" -C /usr/local/bin nfpm
          rm -f "$f" checksums.txt
      - name: Build .deb and .rpm
        run: packaging/linux/build.sh "${{ needs.version.outputs.version }}" dist

      - name: Install test (.deb with systemd)
        run: |
          sudo apt-get install -y ./dist/*.deb
          systemctl is-enabled networkvision
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          echo
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"version":"${{ needs.version.outputs.version }}"'
          curl -fsS http://127.0.0.1:8080/api/auth/me | grep -q '"setup_required":true'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root"'
          sudo ss -lunp | grep -q ':514 '   # syslog bound to 514 as an unprivileged user
          ps -eo user:20,args | grep "[p]ython -m app" | grep -q '^networkvision '
          test "$(sudo stat -c '%a %U' /var/lib/networkvision/.secret_key)" = "600 networkvision"
          test "$(sudo stat -c '%a %U:%G' /etc/networkvision/networkvision.env)" = "640 root:networkvision"
          curl -fsS -X POST -H 'content-type: application/json' -d '{"username":"admin","password":"ci-only-password"}' \
            http://127.0.0.1:8080/api/auth/setup | grep -q '"user":"admin"'
          curl -fsS http://127.0.0.1:8080/api/auth/me | grep -q '"setup_required":false'
          # Upgrade in place keeps data and config
          sudo apt-get install -y --reinstall ./dist/*.deb
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/api/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/auth/me | grep -q '"setup_required":false'
          sudo apt-get purge -y networkvision
          test ! -e /var/lib/networkvision && ! getent passwd networkvision
      - name: Show service log on failure
        if: failure()
        run: sudo journalctl -u networkvision --no-pager -n 200 || true

      - name: Install test (.rpm on Rocky Linux 9)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" rockylinux:9 sh -euc '
            dnf install -y -q /dist/*.rpm
            getent passwd networkvision
            test -f /etc/networkvision/networkvision.env
            cd /tmp && runuser -u networkvision -- env NV_STATIC_DIR=/opt/networkvision/static /opt/networkvision/venv/bin/python -m app --check
            dnf remove -y -q networkvision'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.nfpm_arch }}
          path: |
            dist/*.deb
            dist/*.rpm

  windows:
    needs: [version, web]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt "pyinstaller==${{ env.PYINSTALLER_VERSION }}"
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Code signing certificate (optional)
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        if: env.PFX_BASE64 != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "NV_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build installer
        env:
          NV_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: packaging/windows/build.ps1 -Version "${{ needs.version.outputs.version }}" -OutDir dist

      - name: Install test (silent install, service, firewall, setup page)
        run: |
          $setup = Get-ChildItem dist\NetworkVision-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/PORT=8088", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          (Get-Service NetworkVision).Status
          $ok = $false
          foreach ($i in 1..60) { try { $h = Invoke-RestMethod http://127.0.0.1:8088/api/health; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { throw "web UI did not come up" }
          if ($h.version -ne "${{ needs.version.outputs.version }}") { throw "wrong version $($h.version)" }
          $me = Invoke-RestMethod http://127.0.0.1:8088/api/auth/me
          if (-not $me.setup_required) { throw "expected the first-run setup page" }
          if (-not (Select-String -Path "$env:ProgramData\NetworkVision\networkvision.env" -Pattern '^NV_PORT=8088$')) { throw "port not written to config" }
          if (-not (Test-Path "$env:ProgramData\NetworkVision\data\.secret_key")) { throw "secret key not generated" }
          netsh advfirewall firewall show rule name="NetworkVision Web" | Select-String "8088"
          netsh advfirewall firewall show rule name="NetworkVision Syslog (UDP)" | Select-String "514"
          $udp = Get-NetUDPEndpoint -LocalPort 514 -ErrorAction SilentlyContinue
          if (-not $udp) { throw "syslog not listening on UDP 514" }
          $uninst = Get-ChildItem "${env:ProgramFiles}\NetworkVision\unins*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Get-Service NetworkVision -ErrorAction SilentlyContinue) { throw "service not removed" }
      - name: Show logs on failure
        if: failure()
        run: |
          Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 80 -ErrorAction SilentlyContinue
          Get-ChildItem "$env:ProgramData\NetworkVision\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/NetworkVision-*-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum *.deb *.rpm *.exe > SHA256SUMS-packages.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" *.deb *.rpm *.exe SHA256SUMS-packages.txt --clobber
